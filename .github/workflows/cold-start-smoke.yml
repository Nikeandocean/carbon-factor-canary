# Tier 2b: the same user journey as user-journey-smoke, but with a COLD
# HuggingFace cache -- the path a brand-new user actually walks on their first
# run.
#
# user-journey-smoke pre-warms the embedding model, so it only ever exercises
# the warm path. That hides regressions in the cold path, most notably the
# windows-latest hang where factor_match fetched the model inside the request
# handler and never returned. A warm cache cannot reproduce that.
#
# Cadence is weekly (plus on demand): the cold path is slow and changes far
# less often than launcher/config plumbing, which the daily job covers.
#
# NOTE: keep the smoke invocation in sync with user-journey-smoke.yml -- the
# two files duplicate the step sequence on purpose rather than sharing a
# reusable workflow, so an edit here needs the same edit there.
name: cold-start-smoke

on:
  schedule:
    - cron: '7 15 * * 1' # Mondays 15:07 UTC (daily job runs 14:23)
  workflow_dispatch:

jobs:
  cold-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Realistic cold run is ~5-6 min: pip install (~2 min) + first
    # factor_match downloading and loading the model. The hard caps are
    # initialize 900s + factor_match 900s, so 35 leaves headroom without
    # giving a hung run half an hour of wall clock.
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      # The first Pro call has to fetch ~362 MB before it can answer, so it
      # gets a wider budget than the daily warm-cache job's 300s. Still
      # bounded, so a genuine hang surfaces in 15 min instead of 30.
      CANARY_MATCH_TIMEOUT_S: '900'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Deliberately NO actions/cache and NO warm step: starting from an empty
      # model cache is the entire point. This guard keeps that premise honest --
      # if a runner ever ships a pre-populated cache, this job would silently
      # stop testing the cold path while staying green.
      - name: Guard - model cache must be cold
        run: |
          cache_dir="$HOME/.cache/huggingface"
          if [ -d "$cache_dir" ] && [ -n "$(ls -A "$cache_dir" 2>/dev/null)" ]; then
            echo "::error::$cache_dir is not empty -- this job would not exercise the cold path."
            ls -A "$cache_dir"
            exit 1
          fi
          echo "cold cache confirmed: $cache_dir is absent or empty"

      - name: Guard - license secret must be configured
        env:
          KEY: ${{ secrets.CARBON_FACTOR_LICENSE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret CARBON_FACTOR_LICENSE_KEY is not set. Add it in repo Settings -> Secrets and variables -> Actions. Without it the smoke runs as Free tier and the Pro assertions will fail."
            exit 1
          fi

      - name: User-journey smoke, cold cache (npm wrapper + MCP stdio)
        env:
          CARBON_FACTOR_LICENSE_KEY: ${{ secrets.CARBON_FACTOR_LICENSE_KEY }}
        run: python scripts/smoke_user_journey.py -- npx -y @nikeandocean/carbon-factor-matcher
