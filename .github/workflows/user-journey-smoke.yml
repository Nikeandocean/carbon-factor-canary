# Tier 2: full user simulation, daily + on demand.
# Launches the published server the way a real user does (npm wrapper, which
# auto-installs from PyPI), performs a real MCP stdio handshake, and asserts
# the Pro tier is genuinely engaged -- catching startup crashes, launcher
# regressions (e.g. macOS python3), and silent Pro->Free degradation.
name: user-journey-smoke

on:
  schedule:
    - cron: '23 14 * * *' # daily 14:23 UTC
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Warm HF cache so the first Pro call doesn't re-download ~400 MB
      # on every run. On a miss the server downloads online (runners are
      # overseas, so no GFW issue).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-text2vec-base-chinese

      - name: Guard - license secret must be configured
        env:
          KEY: ${{ secrets.CARBON_FACTOR_LICENSE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret CARBON_FACTOR_LICENSE_KEY is not set. Add it in repo Settings -> Secrets and variables -> Actions. Without it the smoke runs as Free tier and the Pro assertions will fail."
            exit 1
          fi

      - name: User-journey smoke (npm wrapper + MCP stdio)
        env:
          CARBON_FACTOR_LICENSE_KEY: ${{ secrets.CARBON_FACTOR_LICENSE_KEY }}
        run: python scripts/smoke_user_journey.py -- npx -y @nikeandocean/carbon-factor-matcher
